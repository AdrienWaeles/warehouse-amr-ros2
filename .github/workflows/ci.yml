name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: build (Release, -Werror)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS=-Werror

      - name: Build
        run: cmake --build build --parallel

  sanitizers:
    name: sanitizers (ASan + UBSan)
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7

      - name: Configure (Debug, ASan + UBSan)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DAMR_ENABLE_SANITIZERS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Run
        run: ./build/amr_robot
